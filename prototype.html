<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каналсервис — Заявки на выезд (прототип)</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand-blue:#0041A0;
  --brand-blue-2:#2F60A0;
  --brand-red:#FF4200;
  --brand-yellow:#FFD441;
  --bg:#F6F6F6;
  --surface:#FFFFFF;
  --text:#212121;
  --text-muted:#7A7B7B;
  --border:#E5E5E5;
  --link:#3E79C6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:14px;
  line-height:1.45;
}
h1,h2,h3,.brand{font-family:"PT Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}

/* шапка */
.header{
  background:var(--brand-blue);
  color:#fff;
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{font-weight:700;font-size:19px;letter-spacing:1px}
.header-right{opacity:.75;font-size:14px}

.wrap{padding:16px 24px 48px}

/* панель сценариев */
.scenarios{
  background:#EFEFEF;
  border:1px solid var(--border);
  border-radius:4px;
  padding:12px 14px;
  margin-bottom:20px;
}
.scenarios-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scenarios-label{font-weight:600;margin-right:4px}

/* кнопки */
.btn{
  font-family:inherit;
  font-size:14px;
  padding:7px 14px;
  border-radius:4px;
  border:1px solid transparent;
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
}
.btn-primary{background:var(--brand-blue);border-color:var(--brand-blue);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--brand-blue-2);border-color:var(--brand-blue-2)}
.btn-secondary{background:var(--surface);border-color:var(--brand-blue);color:var(--brand-blue)}
.btn-secondary:hover:not(:disabled){background:#EEF3FA}
.btn-danger{background:var(--brand-red);border-color:var(--brand-red);color:#fff}
.btn-danger:hover:not(:disabled){background:#E03A00;border-color:#E03A00}
.btn-danger-outline{background:var(--surface);border-color:var(--brand-red);color:var(--brand-red)}
.btn-danger-outline:hover:not(:disabled){background:#FFF1EC}
.btn-plain{border-color:var(--border)}
.btn-plain:hover:not(:disabled){background:#F0F0F0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:4px 10px;font-size:13px}

/* заголовок области */
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.page-head h1{font-size:22px;margin:0}
.role{color:var(--text-muted)}

/* таблица */
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);font-weight:600;background:#FBFBFB}
tr.req{cursor:pointer}
tr.req:hover>td{background:#F7F9FC}
tr.req.static{cursor:default}
tr.req.static:hover>td{background:transparent}
tr.req.open>td{background:#F2F6FC}
tr.req.done>td{background:#F2F2F2;color:var(--text-muted)}
td.detail-cell{padding:0;background:#FAFAFA}
.col-num{width:72px}
.col-src{width:96px}
.col-when{width:118px}
.col-state{width:170px}
.col-brig{width:150px}
.col-act{width:250px}
.cell-when .hint{display:block}
.addr{color:var(--link);text-decoration:none}
.addr:hover{text-decoration:underline}
.row-actions{display:flex;flex-wrap:wrap;gap:6px}

/* метки состояния */
.badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:13px;border:1px solid transparent;white-space:nowrap}
.badge-new{background:#EDEDED;color:#5C5C5C}
.badge-assigned{background:#E4EDF9;color:var(--brand-blue)}
.badge-work{background:var(--brand-yellow);color:#5A4600}
.badge-dup{background:var(--brand-yellow);color:#3A2E00;border-color:var(--brand-red)}
.badge-closed{background:#E8E8E8;color:#6A6A6A}
.badge-merged{background:#E8E8E8;color:#6A6A6A}

/* панель назначения */
.panel{padding:16px 14px;border-bottom:1px solid var(--border)}
.panel-title{font-family:"PT Sans", system-ui, sans-serif;font-weight:700;margin-bottom:10px}
.brigades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.brigade{
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:4px;
  padding:8px 10px;
  cursor:pointer;
}
.brigade:hover{border-color:var(--brand-blue-2)}
.brigade.selected{border-color:var(--brand-blue);background:#F2F6FC}
.brigade.refused{background:#F2F2F2;color:var(--text-muted);cursor:not-allowed;pointer-events:none}
.brigade.refused .brigade-name{color:var(--text-muted)}
.brigade-name{font-weight:600}
.brigade-phone{font-weight:400;color:var(--text-muted);margin-left:6px}
.brigade-meta{color:var(--text-muted);font-size:13px}
.tag{
  display:inline-block;margin-top:4px;font-size:12px;
  border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--brand-blue);background:#F4F7FC;
}
.tag-refused{color:var(--text-muted);background:#EAEAEA;border-color:#DCDCDC}
.dim{opacity:.6;pointer-events:none}
.panel-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--text-muted);font-size:13px}

/* плашки */
.notice{border-radius:4px;padding:12px 14px;margin-bottom:14px;border:1px solid var(--border);background:var(--surface)}
.notice b{font-family:"PT Sans", system-ui, sans-serif}
.notice-danger{background:#FFEDE6;border-color:var(--brand-red)}
.notice-warn{background:#FFF8DC;border-color:#E0BC33}
.notice-dup{background:#FFF8DC;border-color:var(--brand-red)}
.notice-muted{background:#F0F0F0;border-color:var(--border)}
.notice-line{margin-top:4px}

/* история */
.history{padding:10px 14px;border-bottom:1px solid var(--border);background:#FCFCFC}
.history-title{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:4px}
.history-item{font-size:13px}
.history-item .t{color:var(--text-muted);margin-right:6px}
.history-item.rejected{color:var(--brand-red)}
.history-item .err{color:var(--brand-red)}

/* мобильная вёрстка */
@media (max-width: 900px){
  .brigades{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 780px){
  body{font-size:15px}
  .header{padding:12px 14px;flex-direction:column;align-items:flex-start;gap:2px}
  .header-right{font-size:13px}
  .wrap{padding:12px 12px 40px}
  .scenarios{padding:10px 12px}
  .scenarios-row{gap:6px}
  .scenarios-row .btn{flex:1 1 46%;text-align:center}
  .page-head{flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:10px}
  .brigades{grid-template-columns:1fr}
  .btn{padding:9px 14px}

  table{border:none;background:transparent}
  thead{display:none}
  table, tbody, tr, td{display:block}
  tr.req{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px;
    margin-bottom:8px;
    padding:6px 12px;
  }
  tr.req.has-detail{margin-bottom:0;border-bottom:none;border-radius:4px 4px 0 0}
  tr.req.open{background:#F2F6FC}
  tr.req.done{background:#F2F2F2;color:var(--text-muted)}
  tr.req>td, tr.req:hover>td, tr.req.open>td, tr.req.done>td{
    background:transparent;
    border:none;
    padding:4px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  tr.req>td::before{
    content:attr(data-label);
    flex:0 0 auto;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--text-muted);
  }
  tr.req>td.cell-empty{display:none}
  tr.req>td[data-label="№"]{font-weight:700}
  .cell-when{text-align:right}
  tr.req>td[data-label="Действие"]{display:block;padding:8px 0 4px}
  tr.req>td[data-label="Действие"]::before{display:none}
  .row-actions{flex-direction:column;gap:6px}
  .row-actions .btn{width:100%;text-align:center}
  tr.detail{margin-bottom:8px}
  td.detail-cell{border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px}
  .panel{padding:12px;border-bottom:none}
  .history{border-bottom:none}
  .panel-actions{gap:8px}
  .panel-actions .btn{flex:1 1 auto}
  .hint{flex-basis:100%}
}

@media (max-width: 420px){
  .scenarios-row .btn{flex:1 1 100%}
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">КАНАЛСЕРВИС</div>
  <div class="header-right">Центр управления · Заявки на выезд</div>
</div>

<div class="wrap">
  <div class="scenarios">
    <div class="scenarios-row">
      <span class="scenarios-label">Сценарий:</span>
      <button class="btn btn-plain" data-scenario="1">1. Обычная работа</button>
      <button class="btn btn-plain" data-scenario="2">2. Конфликт назначения</button>
      <button class="btn btn-plain" data-scenario="3">3. Данные недоступны</button>
      <button class="btn btn-plain" data-scenario="4">4. Недостаточно прав</button>
      <button class="btn btn-plain" data-scenario="5">5. Возможный дубль</button>
    </div>
  </div>

  <div class="page-head">
    <h1>Заявки на выезд</h1>
    <div class="role" id="role"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th class="col-num">№</th>
        <th>Адрес</th>
        <th class="col-src">Источник</th>
        <th class="col-when">Поступила</th>
        <th class="col-state">Состояние</th>
        <th class="col-brig">Бригада</th>
        <th class="col-act">Действие</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
"use strict";

var BRIGADES = [
  {n:1,  chief:"Соколов",  district:"Центральный", active:2, tv:false, phone:"+7 (812) 245-11-04"},
  {n:2,  chief:"Гаврилов", district:"Центральный", active:1, tv:true,  phone:"+7 (812) 245-11-27"},
  {n:3,  chief:"Ильин",    district:"Северный",    active:3, tv:false, phone:"+7 (812) 245-12-08"},
  {n:4,  chief:"Панин",    district:"Северный",    active:0, tv:false, phone:"+7 (812) 245-12-41"},
  {n:5,  chief:"Дроздов",  district:"Южный",       active:2, tv:false, phone:"+7 (812) 245-13-16"},
  {n:6,  chief:"Кузьмин",  district:"Южный",       active:1, tv:true,  phone:"+7 (812) 245-13-59"},
  {n:7,  chief:"Лапин",    district:"Западный",    active:0, tv:false, phone:"+7 (812) 245-14-02"},
  {n:8,  chief:"Ершов",    district:"Западный",    active:2, tv:false, phone:"+7 (812) 245-14-73"},
  {n:9,  chief:"Тихонов",  district:"Восточный",   active:1, tv:true,  phone:"+7 (812) 245-15-30"},
  {n:10, chief:"Мельник",  district:"Восточный",   active:3, tv:false, phone:"+7 (812) 245-15-88"},
  {n:11, chief:"Савин",    district:"Центральный", active:1, tv:false, phone:"+7 (812) 245-16-45"}
];

/* дата в заявках — текущий день, чтобы экран не выглядел просроченным */
function today(){
  var d = new Date();
  return pad(d.getDate()) + "." + pad(d.getMonth()+1) + "." + d.getFullYear();
}

var ALL_REQUESTS = {
  1039: {id:1039, addr:"Мира, 22 к. 1",    src:"УК",     at:"07:58", state:"assigned", brigadeNum:5, version:2},
  1040: {id:1040, addr:"Садовая, 7",       src:"Клиент", at:"08:02", state:"work",     brigadeNum:3, version:3},
  1041: {id:1041, addr:"Ленина, 14",       src:"УК",     at:"08:17", state:"new",      brigadeNum:null, version:1},
  1042: {id:1042, addr:"Гоголя, 11",       src:"УК",     at:"08:19", state:"new",      brigadeNum:null, version:1},
  1043: {id:1043, addr:"Мира, 22к1",       src:"Клиент", at:"09:05", state:"new",      brigadeNum:null, version:1},
  1044: {id:1044, addr:"Пролетарская, 12", src:"Клиент", at:"09:12", state:"new",      brigadeNum:null, version:1}
};

/* в каждом сценарии ключевая заявка идёт первой, остальные — только нужные для примера */
var SCENARIO_REQUESTS = {
  1: [1041, 1040, 1039],
  2: [1042, 1039],
  3: [1044, 1041],
  4: [1041, 1040, 1039],
  5: [1043, 1039]
};

var S = null;

function req(id){
  for(var i=0;i<S.requests.length;i++){ if(S.requests[i].id===id) return S.requests[i]; }
  return null;
}
function brigade(n){
  for(var i=0;i<BRIGADES.length;i++){ if(BRIGADES[i].n===n) return BRIGADES[i]; }
  return null;
}
function brigadeLabel(n){ var b=brigade(n); return b ? b.n + ", " + b.chief : ""; }

/* условное время прототипа, шагает по 30 секунд */
function pad(x){ return x<10 ? "0"+x : ""+x; }
function stamp(sec){
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return pad(h)+":"+pad(m)+":"+pad(s);
}
function tick(){
  var t = stamp(S.clock);
  S.clock += 30;
  return t;
}
/* запись истории: «Имя: действие», у неудачных попыток сбоку хвост с текстом ошибки */
function addHistory(id, time, text, err, red){
  if(!S.history[id]) S.history[id] = [];
  S.history[id].push({
    time: time,
    text: text,
    err: err || "",
    red: (red === undefined ? !!err : !!red)
  });
}

function setScenario(n){
  var ids = SCENARIO_REQUESTS[n], list = [];
  for(var i=0;i<ids.length;i++){
    var src = ALL_REQUESTS[ids[i]];
    list.push({
      id:src.id, addr:src.addr, src:src.src, at:src.at, date:today(),
      state:src.state, brigadeNum:src.brigadeNum, version:src.version,
      refused:[], dup:false, conflictSeen:false
    });
  }
  S = {
    scenario: n,
    role: (n===4 ? "observer" : "dispatcher"),
    requests: list,
    history: {},
    open: null,
    panel: null,
    stale: (n===3),
    staleAt: "08:12",
    clock: (n===2 ? 8*3600+19*60+30 : 9*3600+20*60)
  };
  if(n===5) req(1043).dup = true;
  render();
}

function stateBadge(r){
  if(r.state==="new")      return '<span class="badge badge-new">Новая</span>';
  if(r.state==="assigned") return '<span class="badge badge-assigned">Назначена</span>';
  if(r.state==="work")     return '<span class="badge badge-work">В работе</span>';
  if(r.state==="closed")   return '<span class="badge badge-closed">Закрыта</span>';
  if(r.state==="merged")   return '<span class="badge badge-merged">Объединена с 1039</span>';
  return "";
}

function isRefused(r, n){
  for(var i=0;i<r.refused.length;i++){ if(r.refused[i].n===n) return r.refused[i]; }
  return null;
}

/* --- открытие панели --- */
function openRow(id){
  var r = req(id);
  if(S.open===id){ S.open=null; S.panel=null; return render(); }
  if(S.role==="observer"){
    S.open = id;
    S.panel = {mode:"denied"};
    return render();
  }
  if(r.state!=="new") return;
  S.open = id;
  if(r.dup){
    S.panel = {mode:"dup", selected:null};
  } else if(S.stale){
    S.panel = {mode:"stale", selected:null, retrying:false};
  } else {
    S.panel = {mode:"assign", selected:null};
  }
  render();
}

function selectBrigade(n){
  if(!S.panel || S.panel.mode!=="assign") return;
  if(isRefused(req(S.open), n)) return;
  S.panel.selected = n;
  render();
}

function assign(){
  if(!S.panel || S.panel.mode!=="assign") return;   /* после отказа и в блокирующих режимах ничего не отправляется */
  if(S.panel.selected===null) return;
  var r = req(S.open);
  var n = S.panel.selected;

  if(S.scenario===2 && r.id===1042 && !r.conflictSeen){
    r.conflictSeen = true;
    addHistory(r.id, "08:19:00", "Игорь: назначена бригада 2");
    addHistory(r.id, tick(), "Ольга: назначена бригада " + n, "отклонено, версия 1, сейчас 2");
    r.state = "assigned";
    r.brigadeNum = 2;
    r.version = 2;
    S.panel = {mode:"conflict", selected:n};
    return render();
  }

  r.state = "assigned";
  r.brigadeNum = n;
  r.version += 1;
  addHistory(r.id, tick(), "Ольга: назначена бригада " + n);
  S.open = null;
  S.panel = null;
  render();
}

function conflictAck(){ S.open=null; S.panel=null; render(); }
function conflictReassign(){ S.panel = {mode:"assign", selected:null}; render(); }

function retryData(){
  if(!S.panel || S.panel.retrying) return;
  S.panel.retrying = true;
  render();
  setTimeout(function(){
    S.stale = false;
    if(S.panel) S.panel = {mode:"assign", selected:S.panel.selected};
    render();
  }, 1500);
}

function mergeDup(){
  var r = req(S.open);
  r.state = "merged";
  r.dup = false;
  r.brigadeNum = null;
  addHistory(r.id, tick(), "Ольга: заявка объединена с 1039");
  S.open = null;
  S.panel = null;
  render();
}
function keepDup(){
  var r = req(S.open);
  r.dup = false;
  S.panel = {mode: (S.stale ? "stale" : "assign"), selected:null, retrying:false};
  render();
}

/* --- отметки статуса --- */
function depart(id){
  if(S.role==="observer") return;
  var r = req(id);
  if(r.state!=="assigned") return;
  r.state = "work";
  addHistory(id, tick(), "Ольга: бригада выехала");
  render();
}
function finish(id){
  if(S.role==="observer") return;
  var r = req(id);
  if(r.state!=="work") return;
  r.state = "closed";
  addHistory(id, tick(), "Ольга: работы завершены");
  if(S.open===id){ S.open=null; S.panel=null; }
  render();
}
function openRefuse(id){
  if(S.role==="observer") return;
  var r = req(id);
  if(r.state!=="assigned" && r.state!=="work") return;
  S.open = id;
  S.panel = {mode:"refuse"};
  render();
}
function chooseReason(reason){
  var r = req(S.open);
  var t = tick();
  var n = r.brigadeNum;
  r.refused.push({n:n, time:t.slice(0,5)});
  addHistory(r.id, t, "Ольга: бригада " + n + " отказалась, " + reason, "", true);
  r.state = "new";
  r.brigadeNum = null;
  S.open = null;
  S.panel = null;
  render();
}

/* --- отрисовка --- */
function brigadesHtml(disabledLook){
  var r = req(S.open);
  var h = '<div class="brigades' + (disabledLook ? " dim" : "") + '">';
  for(var i=0;i<BRIGADES.length;i++){
    var b = BRIGADES[i];
    var ref = isRefused(r, b.n);
    var sel = (!ref && S.panel && S.panel.selected===b.n) ? " selected" : "";
    h += '<div class="brigade'+sel+(ref?" refused":"")+'" data-brigade="'+b.n+'">'
       +   '<div class="brigade-name">'+b.n+', '+b.chief
       +     '<span class="brigade-phone">'+b.phone+'</span>'
       +   '</div>'
       +   '<div class="brigade-meta">'+b.district+' · активных заявок: '+b.active+'</div>'
       +   (b.tv && !ref ? '<div class="tag">борт для телеинспекции</div>' : '')
       +   (ref ? '<div class="tag tag-refused">отказалась в '+ref.time+'</div>' : '')
       + '</div>';
  }
  return h + '</div>';
}

function assignButton(enabled, hint){
  return '<div class="panel-actions">'
    + '<button class="btn btn-primary" data-act="assign"'+(enabled?"":" disabled")+'>Назначить</button>'
    + (hint ? '<span class="hint">'+hint+'</span>' : '')
    + '</div>';
}

function panelHtml(r){
  var p = S.panel;
  if(!p) return "";

  if(p.mode==="denied"){
    return '<div class="panel">'
      + '<div class="notice notice-muted">'
      +   '<b>Недостаточно прав.</b> Роль «Наблюдатель» не может назначать бригады. Обратитесь к старшему диспетчеру.'
      + '</div>'
      + '</div>';
  }

  if(p.mode==="refuse"){
    return '<div class="panel">'
      + '<div class="panel-title">Причина отказа бригады '+r.brigadeNum+', '+brigade(r.brigadeNum).chief+'</div>'
      + '<div class="panel-actions">'
      +   '<button class="btn btn-secondary" data-act="reason" data-reason="техника">Техника</button>'
      +   '<button class="btn btn-secondary" data-act="reason" data-reason="задержка на предыдущем объекте">Задержка на предыдущем объекте</button>'
      +   '<button class="btn btn-secondary" data-act="reason" data-reason="другое">Другое</button>'
      + '</div>'
      + '</div>';
  }

  if(p.mode==="conflict"){
    return '<div class="panel">'
      + '<div class="notice notice-danger">'
      +   '<b>Назначение отклонено.</b> Заявку уже назначил Игорь в 08:19, бригада 2, Гаврилов.'
      +   '<div class="notice-line">Ваш экран показывал устаревшие данные (версия 1, сейчас 2).</div>'
      + '</div>'
      + '<div class="panel-actions">'
      +   '<button class="btn btn-secondary" data-act="ack">Понятно</button>'
      +   '<button class="btn btn-primary" data-act="reassign">Переназначить</button>'
      +   '<button class="btn btn-primary" disabled>Назначить</button>'
      +   '<span class="hint">назначение отклонено, повторная отправка недоступна</span>'
      + '</div>'
      + '</div>';
  }

  if(p.mode==="dup"){
    return '<div class="panel">'
      + '<div class="notice notice-dup">'
      +   '<b>На этом адресе уже есть активная заявка.</b> Заявка 1039, Мира, 22 к. 1, поступила от УК в 07:58, назначена бригада 5, Дроздов.'
      +   '<div class="panel-actions" style="margin-top:10px">'
      +     '<button class="btn btn-primary" data-act="merge">Объединить</button>'
      +     '<button class="btn btn-secondary" data-act="keep">Это другая заявка</button>'
      +   '</div>'
      + '</div>'
      + '<div class="panel-title">Бригады</div>'
      + brigadesHtml(true)
      + assignButton(false, "назначение недоступно, пока не выбрано одно из двух действий выше")
      + '</div>';
  }

  if(p.mode==="stale"){
    return '<div class="panel">'
      + '<div class="notice notice-warn">'
      +   '<b>Данные могли устареть.</b> Список бригад обновлён в '+S.staleAt+'. Свежие данные получить не удалось.'
      +   '<div class="panel-actions" style="margin-top:10px">'
      +     '<button class="btn btn-secondary" data-act="retry"'+(p.retrying?" disabled":"")+'>'
      +       (p.retrying ? "Повтор запроса…" : "Повторить")
      +     '</button>'
      +   '</div>'
      + '</div>'
      + '<div class="panel-title">Бригады (последние известные данные)</div>'
      + brigadesHtml(true)
      + assignButton(false, "назначение недоступно, пока не обновятся данные")
      + '</div>';
  }

  return '<div class="panel">'
    + '<div class="panel-title">Бригады</div>'
    + brigadesHtml(false)
    + assignButton(p.selected!==null, p.selected===null ? "выберите бригаду" : "")
    + '</div>';
}

function historyHtml(r){
  var items = S.history[r.id];
  if(!items || !items.length) return "";
  var h = '<div class="history"><div class="history-title">История действий</div>';
  for(var i=0;i<items.length;i++){
    var it = items[i];
    h += '<div class="history-item'+(it.red?" rejected":"")+'">'
       +   '<span class="t">'+it.time+'</span>'+it.text
       +   (it.err ? '<span class="err"> — '+it.err+'</span>' : '')
       + '</div>';
  }
  return h + '</div>';
}

function actionsHtml(r){
  var obs = (S.role==="observer");
  var dis = obs ? " disabled" : "";
  var b = [];
  if(r.state==="new"){
    b.push('<button class="btn btn-secondary btn-sm" data-act="open" data-id="'+r.id+'"'+dis+'>Назначить</button>');
  } else if(r.state==="assigned"){
    b.push('<button class="btn btn-secondary btn-sm" data-act="depart" data-id="'+r.id+'"'+dis+'>Бригада выехала</button>');
    b.push('<button class="btn btn-danger-outline btn-sm" data-act="refuse" data-id="'+r.id+'"'+dis+'>Бригада отказалась</button>');
  } else if(r.state==="work"){
    b.push('<button class="btn btn-secondary btn-sm" data-act="finish" data-id="'+r.id+'"'+dis+'>Работы завершены</button>');
    b.push('<button class="btn btn-danger-outline btn-sm" data-act="refuse" data-id="'+r.id+'"'+dis+'>Бригада отказалась</button>');
  }
  if(!b.length) return {html:'<span class="hint">—</span>', empty:true};
  return {html:'<div class="row-actions">'+b.join("")+'</div>', empty:false};
}

function render(){
  document.getElementById("role").textContent =
    (S.role==="observer" ? "Наблюдатель: Ольга" : "Диспетчер: Ольга");

  var btns = document.querySelectorAll("[data-scenario]");
  for(var i=0;i<btns.length;i++){
    var on = (parseInt(btns[i].getAttribute("data-scenario"),10)===S.scenario);
    btns[i].className = "btn " + (on ? "btn-primary" : "btn-plain");
  }

  var html = "";
  for(var j=0;j<S.requests.length;j++){
    var r = S.requests[j];
    var badge = r.dup
      ? '<span class="badge badge-dup">Возможный дубль</span>'
      : stateBadge(r);
    var act = actionsHtml(r);
    var brigadeCell = r.brigadeNum ? brigadeLabel(r.brigadeNum) : '<span class="hint">—</span>';

    var detail = (S.open===r.id ? panelHtml(r) : "") + historyHtml(r);

    var cls = "req";
    if(S.role!=="observer" && r.state!=="new") cls += " static";
    if(S.open===r.id) cls += " open";
    if(r.state==="closed" || r.state==="merged") cls += " done";
    if(detail) cls += " has-detail";

    html += '<tr class="'+cls+'" data-row="'+r.id+'">'
      + '<td data-label="№">'+r.id+'</td>'
      + '<td data-label="Адрес"><a class="addr" href="https://yandex.ru/maps/?text='+encodeURIComponent(r.addr)+'" target="_blank" rel="noopener">'+r.addr+'</a></td>'
      + '<td data-label="Источник">'+r.src+'</td>'
      + '<td data-label="Поступила"><div class="cell-when">'+r.at+'<span class="hint">'+r.date+'</span></div></td>'
      + '<td data-label="Состояние">'+badge+'</td>'
      + '<td data-label="Бригада"'+(r.brigadeNum ? '' : ' class="cell-empty"')+'>'+brigadeCell+'</td>'
      + '<td data-label="Действие"'+(act.empty ? ' class="cell-empty"' : '')+'>'+act.html+'</td>'
      + '</tr>';

    if(detail){
      html += '<tr class="detail"><td class="detail-cell" colspan="7">'+detail+'</td></tr>';
    }
  }
  document.getElementById("tbody").innerHTML = html;
}

/* --- события --- */
document.addEventListener("click", function(e){
  /* клик по адресу ведёт на карты и не раскрывает панель */
  if(e.target.closest("a.addr")){ e.stopPropagation(); return; }

  var sc = e.target.closest("[data-scenario]");
  if(sc){ setScenario(parseInt(sc.getAttribute("data-scenario"),10)); return; }

  var act = e.target.closest("[data-act]");
  if(act){
    if(act.disabled) return;
    var a = act.getAttribute("data-act");
    var id = parseInt(act.getAttribute("data-id"),10);
    if(a==="open")     return openRow(id);
    if(a==="depart")   return depart(id);
    if(a==="finish")   return finish(id);
    if(a==="refuse")   return openRefuse(id);
    if(a==="reason")   return chooseReason(act.getAttribute("data-reason"));
    if(a==="assign")   return assign();
    if(a==="ack")      return conflictAck();
    if(a==="reassign") return conflictReassign();
    if(a==="retry")    return retryData();
    if(a==="merge")    return mergeDup();
    if(a==="keep")     return keepDup();
    return;
  }

  var br = e.target.closest("[data-brigade]");
  if(br){ selectBrigade(parseInt(br.getAttribute("data-brigade"),10)); return; }

  var row = e.target.closest("[data-row]");
  if(row){ openRow(parseInt(row.getAttribute("data-row"),10)); return; }
});

setScenario(1);
</script>
</body>
</html>
